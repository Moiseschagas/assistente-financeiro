<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5fe0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanças">
<title>Assistente Financeiro Pessoal</title>
<style>
:root{--bg:#f3f6fc;--sf:#fff;--tx:#0f1b33;--mu:#5b6b8a;--bd:#dce4f2;--ac:#1f5fe0;--ac2:#e6eefc;--ok:#0f9d6b;--wa:#b36b00;--er:#d13b3b;--okb:#e2f6ee;--wab:#fff3d9;--erb:#fde7e7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--sf:#131c30;--tx:#e8eefb;--mu:#93a3c4;--bd:#25314d;--ac:#5b93ff;--ac2:#1b2a4a;--ok:#35d29a;--wa:#f0b24a;--er:#ff7b7b;--okb:#12352b;--wab:#3a2e12;--erb:#3b1a1a}}
:root[data-theme="dark"]{--bg:#0b1220;--sf:#131c30;--tx:#e8eefb;--mu:#93a3c4;--bd:#25314d;--ac:#5b93ff;--ac2:#1b2a4a;--ok:#35d29a;--wa:#f0b24a;--er:#ff7b7b;--okb:#12352b;--wab:#3a2e12;--erb:#3b1a1a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:1040px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:22px;margin:0 0 2px}h2{font-size:16px;margin:22px 0 10px}
.sub{color:var(--mu);margin:0 0 14px;font-size:13px}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px}
nav button{border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:9px 14px;border-radius:999px;cursor:pointer;font:inherit;white-space:nowrap}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px}
.tot{background:var(--ac);color:#fff;border:0}.tot .sm{color:#dbe7ff}
.big{font-size:24px;font-weight:700;margin:4px 0}.neg{color:var(--er)}.pos{color:var(--ok)}
.sm{font-size:12px;color:var(--mu);display:flex;gap:10px;flex-wrap:wrap}
.bn{display:flex;align-items:center;gap:8px;font-weight:600}.bn i{width:10px;height:10px;border-radius:50%}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mu)}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);width:100%}
input[type=date]{color-scheme:light dark;min-height:38px;cursor:pointer}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
.btn{background:var(--ac);color:#fff;border:0;padding:9px 14px;border-radius:9px;cursor:pointer;font:inherit}
.btn.g{background:var(--ac2);color:var(--ac)}.x{background:none;border:0;color:var(--mu);cursor:pointer;font-size:16px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu);font-size:12px;font-weight:600}
.chip{padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
.paga{background:var(--okb);color:var(--ok)}.aberta{background:var(--ac2);color:var(--ac)}.atrasada{background:var(--erb);color:var(--er)}
.al{padding:10px 12px;border-radius:10px;margin-bottom:8px;font-size:14px}.al.wa{background:var(--wab);color:var(--wa)}.al.er{background:var(--erb);color:var(--er)}.al.ok{background:var(--okb);color:var(--ok)}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0}.bar b{display:block;height:100%;background:var(--ac)}
.fc{display:flex;gap:8px;align-items:flex-end;height:120px}.fc div{flex:1;text-align:center;font-size:11px;color:var(--mu)}.fc b{display:block;background:var(--ac);border-radius:4px 4px 0 0;margin-bottom:4px}
.empty{color:var(--mu);font-size:14px;padding:8px 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<div class="w">
<h1>Assistente Financeiro Pessoal</h1>
<p class="sub">Seus bancos, contas e cartões em um só lugar. Os dados ficam salvos neste navegador.</p>
<div class="row" style="justify-content:space-between;margin-bottom:12px"><span class="sm" id="st"></span><button class="btn g" onclick="save()">Salvar agora</button></div>
<nav id="nav"></nav>
<main id="app"></main>
</div>
<script>
const B=[['mp','Mercado Pago','#009EE3'],['it','Itaú','#EC7000'],['br','Bradesco','#CC092F'],['nu','Nubank','#820AD1'],['sa','Santander','#EC0000']];
let S={init:{},mov:[],bills:[],cards:[],buys:[],paid:{},imp:{}},tab='r';
try{const r=localStorage.getItem('af1');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('af1',JSON.stringify(S));window._ok=1}catch(e){window._ok=0}window._t=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});stat()};
function stat(){const e=document.getElementById('st');if(e)e.textContent=window._t?(window._ok?'✓ Salvo automaticamente às '+window._t:'Não foi possível salvar neste navegador'):'Salvamento automático ativo'}
const money=n=>{n=n||0;return (n<0?'-':'')+'R$ '+Math.abs(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const TODAY=iso(new Date()),dt=s=>new Date(s+'T00:00:00'),br=s=>s.split('-').reverse().join('/');
const days=s=>Math.round((dt(s)-dt(TODAY))/864e5);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const bn=id=>(B.find(b=>b[0]===id)||[0,'?'])[1];
const bopts=()=>B.map(b=>`<option value="${b[0]}">${b[1]}</option>`).join('');
const fd=e=>{e.preventDefault();return Object.fromEntries(new FormData(e.target))};
const num=v=>parseFloat(String(v).replace(',','.'));
const chip=s=>`<span class="chip ${s}">${s}</span>`;
const ymBR=ym=>ym.split('-').reverse().join('/');

function bal(id){let i=+S.init[id]||0,e=0,s=0;S.mov.filter(m=>m.b===id).forEach(m=>m.t==='e'?e+=m.v:s+=m.v);return{i,e,s,sd:i+e-s}}
function invs(){const M={};S.buys.forEach(p=>{const c=S.cards.find(x=>x.id===p.card);if(!c)return;const d=dt(p.d),m=d.getFullYear()*12+d.getMonth()+(d.getDate()>c.fe?1:0),pv=p.v/p.n;
for(let k=0;k<p.n;k++){const mm=m+k,y=Math.floor(mm/12),mo=mm%12,ym=y+'-'+String(mo+1).padStart(2,'0'),key=c.id+'|'+ym;
const I=M[key]||(M[key]={key,c,ym,total:0,due:iso(new Date(y,mo+(c.ve<=c.fe?1:0),c.ve))});I.total+=pv}});
return Object.values(M).map(I=>{I.paid=!!S.paid[I.key];I.st=I.paid?'paga':I.due<TODAY?'atrasada':'aberta';return I}).sort((a,b)=>a.due<b.due?-1:1)}
function alerts(){const a=[],w=d=>d===0?'hoje':'em '+d+' dia(s)';
S.bills.filter(b=>!b.paid).forEach(b=>{const d=days(b.d);if(d<0)a.push(['er',`Conta em atraso: ${esc(b.n)} (${money(b.v)}), venceu em ${br(b.d)}.`]);else if(d<=3)a.push(['wa',`${esc(b.n)} vence ${w(d)}: ${money(b.v)}.`])});
invs().filter(i=>!i.paid).forEach(i=>{const d=days(i.due);if(d<0)a.push(['er',`Fatura em atraso: ${esc(i.c.n)} ${ymBR(i.ym)} (${money(i.total)}).`]);else if(d<=5)a.push(['wa',`Fatura ${esc(i.c.n)} vence ${w(d)}: ${money(i.total)}.`])});return a}

function chartBanks(){const W=600,mx=Math.max(1,...B.flatMap(b=>{const x=bal(b[0]);return[x.e,x.s]}));
let o=`<svg viewBox="0 0 ${W} 165" width="100%" role="img" aria-label="Entradas e saídas por banco">`;
B.forEach((b,i)=>{const x=bal(b[0]),w=W/5,cx=i*w+w/2,h1=x.e/mx*110,h2=x.s/mx*110;
o+=`<rect x="${cx-26}" y="${130-h1}" width="24" height="${h1}" rx="3" fill="var(--ok)"/><rect x="${cx+2}" y="${130-h2}" width="24" height="${h2}" rx="3" fill="var(--er)"/><text x="${cx}" y="152" text-anchor="middle" font-size="12" fill="var(--mu)">${b[1]}</text>`});
return o+'</svg><div class="sm"><span class="pos">■ Entradas</span><span class="neg">■ Saídas</span></div>'}

function vR(){let tot=0,te=0,ts=0;
const bc=B.map(b=>{const x=bal(b[0]);tot+=x.sd;te+=x.e;ts+=x.s;
return `<div class="card"><div class="bn"><i style="background:${b[2]}"></i>${b[1]}</div><div class="big ${x.sd<0?'neg':''}">${money(x.sd)}</div><div class="sm"><span class="pos">+ ${money(x.e)}</span><span class="neg">− ${money(x.s)}</span></div><label style="margin-top:8px">Saldo inicial (R$)<input type="number" step="0.01" value="${x.i||''}" placeholder="0,00" onchange="setInit('${b[0]}',this.value)"></label></div>`}).join('');
const al=alerts(),used=invs().filter(i=>!i.paid).reduce((s,i)=>s+i.total,0);
let tip='Cadastre os saldos iniciais e suas movimentações para ver a análise.';
if(S.mov.length)tip=ts>te?`Suas saídas registradas (${money(ts)}) superam as entradas (${money(te)}). Vale revisar os maiores gastos na aba Movimentações.`:`Suas entradas (${money(te)}) cobrem as saídas (${money(ts)}) no período registrado, com sobra de ${money(te-ts)}.`;
return `<div class="card tot"><div class="sm">Saldo total consolidado (${B.length} bancos)</div><div class="big">${money(tot)}</div><div class="sm"><span>Entradas ${money(te)}</span><span>Saídas ${money(ts)}</span><span>Faturas em aberto ${money(used)}</span></div></div>
<h2>Saldo por banco</h2><div class="grid">${bc}</div>
<h2>Alertas</h2>${al.length?al.map(a=>`<div class="al ${a[0]}">${a[1]}</div>`).join(''):'<div class="al ok">Nenhuma conta ou fatura vencendo nos próximos dias.</div>'}
<h2>Entradas e saídas por banco</h2><div class="card">${chartBanks()}</div>
<h2>Análise</h2><div class="card">${tip}<div class="sm" style="margin-top:6px">As compras no cartão só viram saída do banco quando a fatura é paga, sem duplicidade.</div></div>`}

function vM(){const f=window._f||'';const L=S.mov.filter(m=>!f||m.b===f).sort((a,b)=>a.d<b.d?1:-1);
return `<div class="card"><form onsubmit="return addMov(event)"><label>Banco<select name="b">${bopts()}</select></label><label>Tipo<select name="t"><option value="e">Entrada</option><option value="s">Saída</option></select></label><label>Valor (R$)<input name="v" type="number" step="0.01" min="0.01" required></label><label>Data<input name="d" type="date" value="${TODAY}" required onclick="try{this.showPicker()}catch(e){}"></label><label>Descrição<input name="n" required></label><button class="btn">Adicionar</button></form></div>
<h2>Histórico</h2><div class="row"><label style="width:200px">Filtrar banco<select onchange="window._f=this.value;render()"><option value="">Todos</option>${B.map(b=>`<option value="${b[0]}" ${f===b[0]?'selected':''}>${b[1]}</option>`).join('')}</select></label></div>
<div class="card tw" style="margin-top:10px">${L.length?`<table><tr><th>Data</th><th>Banco</th><th>Descrição</th><th>Valor</th><th></th></tr>${L.map(m=>`<tr><td>${br(m.d)}</td><td>${bn(m.b)}</td><td>${esc(m.n)}</td><td class="${m.t==='e'?'pos':'neg'}">${m.t==='e'?'+':'−'} ${money(m.v)}</td><td><button class="x" onclick="delMov('${m.id}')" title="Excluir">✕</button></td></tr>`).join('')}</table>`:'<div class="empty">Nenhuma movimentação registrada ainda.</div>'}</div>`}

function vC(){const L=[...S.bills].sort((a,b)=>a.d<b.d?-1:1);
return `<div class="card"><form onsubmit="return addBill(event)"><label>Descrição<input name="n" required></label><label>Valor (R$)<input name="v" type="number" step="0.01" min="0.01" required></label><label>Vencimento<input name="d" type="date" required onclick="try{this.showPicker()}catch(e){}"></label><label>Pagar com<select name="b">${bopts()}</select></label><button class="btn">Adicionar conta</button></form></div>
<h2>Contas a pagar</h2><div class="card tw">${L.length?`<table><tr><th>Vencimento</th><th>Descrição</th><th>Valor</th><th>Banco</th><th>Status</th><th></th></tr>${L.map(b=>{const st=b.paid?'paga':b.d<TODAY?'atrasada':'aberta';return `<tr><td>${br(b.d)}</td><td>${esc(b.n)}</td><td>${money(b.v)}</td><td>${bn(b.b)}</td><td>${chip(st)}</td><td>${b.paid?'':`<button class="btn g" onclick="payBill('${b.id}')">Pagar</button>`} <button class="x" onclick="delBill('${b.id}')" title="Excluir">✕</button></td></tr>`}).join('')}</table>`:'<div class="empty">Nenhuma conta cadastrada.</div>'}</div>
<div class="sm" style="margin-top:8px">Ao pagar, o valor sai do saldo do banco escolhido e aparece no histórico.</div>`}

function vK(){const I=invs(),open=I.filter(i=>!i.paid);
const used=c=>open.filter(i=>i.c.id===c).reduce((s,i)=>s+i.total,0);
const tu=S.cards.reduce((s,c)=>s+used(c.id),0),tl=S.cards.reduce((s,c)=>s+c.l,0);
const byM={};open.forEach(i=>byM[i.ym]=(byM[i.ym]||0)+i.total);const ms=Object.keys(byM).sort().slice(0,6),mx=Math.max(1,...ms.map(m=>byM[m]));
const cal=[...open.map(i=>[i.due,`Fatura ${esc(i.c.n)} (${ymBR(i.ym)})`,i.total,i.st]),...S.bills.filter(b=>!b.paid).map(b=>[b.d,esc(b.n),b.v,b.d<TODAY?'atrasada':'aberta'])].sort((a,b)=>a[0]<b[0]?-1:1);
window._I=I;
const blocks=S.cards.map(c=>{const u=used(c.id),pc=Math.min(100,c.l?u/c.l*100:0),ci=I.filter(i=>i.c.id===c.id&&!i.paid),ps=S.buys.filter(p=>p.card===c.id);
return `<div class="card" style="margin-bottom:12px"><div class="row" style="justify-content:space-between"><div class="bn"><i style="background:${(B.find(b=>b[0]===c.b)||[0,0,'#888'])[2]}"></i>${esc(c.n)} · ${bn(c.b)}</div><button class="x" onclick="delCard('${c.id}')" title="Excluir cartão">✕</button></div>
<div class="bar"><b style="width:${pc}%"></b></div><div class="sm"><span>Limite ${money(c.l)}</span><span>Utilizado ${money(u)}</span><span class="pos">Disponível ${money(c.l-u)}</span><span>Fecha dia ${c.fe} · vence dia ${c.ve}</span></div>
<h2 style="font-size:14px">Faturas</h2>${ci.length?ci.map(i=>`<div class="row" style="margin-bottom:6px"><span>${ymBR(i.ym)} · vence ${br(i.due)} · <b>${money(i.total)}</b></span>${chip(i.st)}<select id="pb_${i.key}" style="width:auto">${bopts()}</select><button class="btn g" onclick="payInv('${i.key}')">Pagar fatura</button></div>`).join(''):'<div class="empty">Sem faturas em aberto.</div>'}
<h2 style="font-size:14px">Compras</h2>${ps.length?ps.map(p=>{return `<div class="row sm" style="margin-bottom:4px"><span>${br(p.d)} · ${esc(p.n2)} · ${money(p.v)} em ${p.n}x ${p.n>1?`(restam ${leftOf(p,c)})`:''}</span><button class="x" onclick="delBuy('${p.id}')">✕</button></div>`}).join(''):'<div class="empty">Nenhuma compra.</div>'}</div>`}).join('');
return `<div class="grid"><div class="card"><div class="sm">Total utilizado</div><div class="big">${money(tu)}</div></div><div class="card"><div class="sm">Limite disponível total</div><div class="big pos">${money(tl-tu)}</div></div><div class="card"><div class="sm">Faturas a vencer</div><div class="big">${money(tu)}</div></div></div>
<h2>Novo cartão</h2><div class="card"><form onsubmit="return addCard(event)"><label>Banco<select name="b">${bopts()}</select></label><label>Identificação<input name="n" placeholder="Ex.: Nubank Platinum" required></label><label>Limite total (R$)<input name="l" type="number" step="0.01" min="0" required></label><label>Dia de fechamento<input name="fe" type="number" min="1" max="31" required></label><label>Dia de vencimento<input name="ve" type="number" min="1" max="31" required></label><button class="btn">Cadastrar</button></form></div>
${S.cards.length?`<h2>Nova compra no cartão</h2><div class="card"><form onsubmit="return addBuy(event)"><label>Cartão<select name="card">${S.cards.map(c=>`<option value="${c.id}">${esc(c.n)}</option>`).join('')}</select></label><label>Descrição<input name="n2" required></label><label>Valor total (R$)<input name="v" type="number" step="0.01" min="0.01" required></label><label>Data<input name="d" type="date" value="${TODAY}" required onclick="try{this.showPicker()}catch(e){}"></label><label>Parcelas<input name="n" type="number" min="1" max="48" value="1" required></label><button class="btn">Lançar</button></form></div>
<div class="sm" style="margin-top:6px">Compras no cartão não entram como despesa do banco; apenas o pagamento da fatura.</div>`:''}
<h2>Cartões</h2>${blocks||'<div class="empty">Cadastre seu primeiro cartão acima.</div>'}
<h2>Previsão de parcelas e faturas</h2><div class="card">${ms.length?`<div class="fc">${ms.map(m=>`<div><b style="height:${byM[m]/mx*80}px"></b>${ymBR(m)}<br>${money(byM[m])}</div>`).join('')}</div>`:'<div class="empty">Sem compromissos futuros.</div>'}</div>
<h2>Calendário de vencimentos</h2><div class="card tw">${cal.length?`<table>${cal.map(c=>`<tr><td>${br(c[0])}</td><td>${c[1]}</td><td>${money(c[2])}</td><td>${chip(c[3])}</td></tr>`).join('')}</table>`:'<div class="empty">Nada a vencer.</div>'}</div>`}
function leftOf(p,c){const d=dt(p.d),m=d.getFullYear()*12+d.getMonth()+(d.getDate()>c.fe?1:0);let r=0;for(let k=0;k<p.n;k++){const mm=m+k;if(!S.paid[c.id+'|'+Math.floor(mm/12)+'-'+String(mm%12+1).padStart(2,'0')])r++}return r}

function vD(){const P=window._p||'3',fb=window._db||'',n=new Date(),cut=P==='all'?'0000-00-00':iso(new Date(n.getFullYear(),n.getMonth()-(+P-1),1));
const L=S.mov.filter(m=>m.d>=cut&&(!fb||m.b===fb));let e=0,s=0;const M={},K={},O=[];
L.forEach(m=>{const y=m.d.slice(0,7),k=K[m.b]||(K[m.b]={e:0,s:0}),q=M[y]||(M[y]={e:0,s:0});if(m.t==='e'){e+=m.v;q.e+=m.v;k.e+=m.v}else{s+=m.v;q.s+=m.v;k.s+=m.v;O.push(m)}});
const ks=Object.keys(M).sort().slice(-12),mx=Math.max(1,...ks.flatMap(k=>[M[k].e,M[k].s])),W=600,w=W/Math.max(ks.length,1);
const ch=ks.length?`<svg viewBox="0 0 ${W} 185" width="100%" role="img" aria-label="Entradas e saídas por mês">${ks.map((k,i)=>{const cx=i*w+w/2,bw=Math.min(26,w/2-4),h1=M[k].e/mx*130,h2=M[k].s/mx*130;return `<rect x="${cx-bw-1}" y="${150-h1}" width="${bw}" height="${h1}" rx="3" fill="var(--ok)"/><rect x="${cx+1}" y="${150-h2}" width="${bw}" height="${h2}" rx="3" fill="var(--er)"/><text x="${cx}" y="171" text-anchor="middle" font-size="12" fill="var(--mu)">${k.slice(5)}/${k.slice(2,4)}</text>`}).join('')}</svg>`:'<div class="empty">Sem movimentações no período.</div>';
const top=O.sort((a,b)=>b.v-a.v).slice(0,5),bk=B.filter(b=>K[b[0]]);
return `<div class="row"><label style="width:180px">Período<select onchange="window._p=this.value;render()">${[['1','Mês atual'],['3','Últimos 3 meses'],['6','Últimos 6 meses'],['12','Últimos 12 meses'],['all','Tudo']].map(o=>`<option value="${o[0]}" ${o[0]===P?'selected':''}>${o[1]}</option>`).join('')}</select></label><label style="width:200px">Banco<select onchange="window._db=this.value;render()"><option value="">Todos</option>${B.map(b=>`<option value="${b[0]}" ${fb===b[0]?'selected':''}>${b[1]}</option>`).join('')}</select></label></div>
<div class="grid" style="margin-top:12px"><div class="card"><div class="sm">Entradas</div><div class="big pos">${money(e)}</div></div><div class="card"><div class="sm">Saídas</div><div class="big neg">${money(s)}</div></div><div class="card"><div class="sm">Resultado</div><div class="big ${e-s<0?'neg':'pos'}">${money(e-s)}</div><div class="sm">${e?`Saídas equivalem a ${Math.round(s/e*100)}% das entradas`:'Sem entradas no período'}</div></div></div>
<h2>Evolução mensal</h2><div class="card">${ch}<div class="sm"><span class="pos">■ Entradas</span><span class="neg">■ Saídas</span></div></div>
<h2>Por banco</h2><div class="card tw">${bk.length?`<table><tr><th>Banco</th><th>Entradas</th><th>Saídas</th><th>Resultado</th></tr>${bk.map(b=>{const k=K[b[0]];return `<tr><td><span class="bn"><i style="background:${b[2]}"></i>${b[1]}</span></td><td class="pos">${money(k.e)}</td><td class="neg">${money(k.s)}</td><td class="${k.e-k.s<0?'neg':'pos'}">${money(k.e-k.s)}</td></tr>`}).join('')}</table>`:'<div class="empty">Sem dados no período.</div>'}</div>
<h2>Maiores saídas</h2><div class="card tw">${top.length?`<table>${top.map(m=>`<tr><td>${br(m.d)}</td><td>${bn(m.b)}</td><td>${esc(m.n)}</td><td class="neg">${money(m.v)}</td></tr>`).join('')}</table>`:'<div class="empty">Sem saídas no período.</div>'}</div>`}

function vI(){const msg=window._msg||'';
const bc=B.map(b=>{const x=bal(b[0]),n=S.mov.filter(m=>m.b===b[0]).length,im=S.imp[b[0]];
return `<div class="card"><div class="bn"><i style="background:${b[2]}"></i>${b[1]}</div><div class="big ${x.sd<0?'neg':''}">${money(x.sd)}</div><div class="sm"><span>${n} movimentações</span><span>${im?'Último extrato: '+im:'Nenhum extrato importado'}</span></div><div class="row" style="margin-top:8px"><button class="btn g" onclick="window._f='${b[0]}';tab='m';render()">Ver dados</button></div></div>`}).join('');
return `<h2 style="margin-top:0">Dados por banco</h2><div class="grid">${bc}</div>
<h2>Importar extrato</h2><div class="card"><div class="grid"><label>Banco<select id="ib">${bopts()}</select></label><label>Arquivo (OFX ou CSV)<input id="if" type="file" accept=".ofx,.csv,.txt"></label></div><div class="row" style="margin-top:10px"><button class="btn" onclick="impFile()">Importar</button></div>${msg?`<div class="al ok" style="margin-top:10px">${msg}</div>`:''}<div class="sm" style="margin-top:8px">Baixe o extrato da conta no app ou site do banco. Movimentações repetidas são ignoradas. Não importe o extrato do cartão aqui: use a aba Cartões, para não duplicar.</div></div>`}
function parseOFX(t){const o=[];(t.match(/<STMTTRN>[\s\S]*?(?=<\/STMTTRN>|<STMTTRN>|<\/BANKTRANLIST>|$)/gi)||[]).forEach(x=>{const gt=k=>{const m=x.match(new RegExp('<'+k+'>([^<\\r\\n]*)','i'));return m?m[1].trim():''};const a=num(gt('TRNAMT')),d=gt('DTPOSTED');if(!a||d.length<8)return;o.push({d:d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8),v:Math.abs(a),t:a<0?'s':'e',n:gt('MEMO')||gt('NAME')||'Movimentação',id:gt('FITID')})});return o}
function parseCSV(t){const R=t.split(/\r?\n/).filter(l=>l.trim());if(R.length<2)return[];const hi=Math.max(0,R.findIndex(l=>/data/i.test(l))),sp=R[hi].includes(';')?';':',';
const sc=l=>{const o=[];let c='',q=0;for(const ch of l){if(ch==='"')q=!q;else if(ch===sp&&!q){o.push(c);c=''}else c+=ch}o.push(c);return o.map(x=>x.trim())};
const H=sc(R[hi]).map(x=>x.toLowerCase()),di=H.findIndex(h=>/data/.test(h)),vi=H.findIndex(h=>/valor|amount/.test(h)),ni=H.findIndex(h=>/descri|hist|estab|lan[cç]|memo/.test(h));
if(di<0||vi<0)return[];const o=[];
R.slice(hi+1).forEach(l=>{const c=sc(l);let d=c[di]||'',m=d.match(/(\d{2})\/(\d{2})\/(\d{4})/);d=m?m[3]+'-'+m[2]+'-'+m[1]:(d.match(/^\d{4}-\d{2}-\d{2}/)||[''])[0];
let s=(c[vi]||'').replace(/[R$\s]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const a=parseFloat(s);if(!d||isNaN(a)||!a)return;o.push({d,v:Math.abs(a),t:a<0?'s':'e',n:(ni>=0?c[ni]:'')||'Movimentação',id:''})});return o}
function impFile(){const f=document.getElementById('if').files[0],b=document.getElementById('ib').value;if(!f){window._msg='Escolha um arquivo primeiro.';render();return}
const r=new FileReader();r.onload=()=>{let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(r.result)}catch(e){t=new TextDecoder('windows-1252').decode(r.result)}
const L=/<STMTTRN>/i.test(t)?parseOFX(t):parseCSV(t);let a=0,d=0;const seen=new Set(S.mov.map(m=>m.k).filter(Boolean));
L.forEach(x=>{const k=[b,x.d,x.v,x.t,x.n,x.id].join('|');if(seen.has(k)){d++;return}seen.add(k);S.mov.push({id:uid(),b,t:x.t,v:x.v,d:x.d,n:x.n,k});a++});
if(a)S.imp[b]=br(TODAY);save();window._msg=L.length?`${a} movimentações importadas em ${bn(b)}; ${d} repetidas ignoradas.`:'Não encontrei movimentações neste arquivo. Confira se é OFX ou CSV com colunas de data, descrição e valor.';render()};r.readAsArrayBuffer(f)}
function setInit(id,v){S.init[id]=num(v)||0;save();render()}
function addMov(e){const f=fd(e),v=num(f.v);if(!(v>0))return false;S.mov.push({id:uid(),b:f.b,t:f.t,v,d:f.d,n:f.n});save();render();return false}
function delMov(id){const m=S.mov.find(x=>x.id===id);if(m){if(m.inv)delete S.paid[m.inv];if(m.bill){const b=S.bills.find(x=>x.id===m.bill);if(b)b.paid=false}}S.mov=S.mov.filter(x=>x.id!==id);save();render()}
function addBill(e){const f=fd(e);S.bills.push({id:uid(),n:f.n,v:num(f.v),d:f.d,b:f.b,paid:false});save();render();return false}
function payBill(id){const b=S.bills.find(x=>x.id===id);if(!b||b.paid)return;b.paid=true;S.mov.push({id:uid(),b:b.b,t:'s',v:b.v,d:TODAY,n:'Pagamento: '+b.n,bill:id});save();render()}
function delBill(id){S.mov=S.mov.filter(m=>m.bill!==id);S.bills=S.bills.filter(b=>b.id!==id);save();render()}
function addCard(e){const f=fd(e);S.cards.push({id:uid(),b:f.b,n:f.n,l:num(f.l),fe:+f.fe,ve:+f.ve});save();render();return false}
function delCard(id){S.cards=S.cards.filter(c=>c.id!==id);S.buys=S.buys.filter(p=>p.card!==id);save();render()}
function addBuy(e){const f=fd(e);S.buys.push({id:uid(),card:f.card,n2:f.n2,v:num(f.v),d:f.d,n:Math.max(1,+f.n||1)});save();render();return false}
function delBuy(id){S.buys=S.buys.filter(p=>p.id!==id);save();render()}
function payInv(key){const i=invs().find(x=>x.key===key);if(!i||i.paid)return;S.mov.push({id:uid(),b:document.getElementById('pb_'+key).value,t:'s',v:i.total,d:TODAY,n:`Fatura ${i.c.n} ${ymBR(i.ym)}`,inv:key});S.paid[key]=1;save();render()}

const TABS=[['r','Visão geral',vR],['d','Dashboard',vD],['i','Bancos e extratos',vI],['m','Movimentações',vM],['c','Contas a pagar',vC],['k','Cartões',vK]];
function render(){$n.innerHTML=TABS.map(t=>`<button class="${t[0]===tab?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('');$a.innerHTML=TABS.find(t=>t[0]===tab)[2]()}
const $n=document.getElementById('nav'),$a=document.getElementById('app');
render();stat();
</script>
